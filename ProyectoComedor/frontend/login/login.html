<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema Comedor</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="login.js" defer></script>
</head>
<body>
    <div class="auth-card">
        <div class="card-header">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
            </div>
            <h1 class="card-title">Iniciar Sesión</h1>
            <p class="card-subtitle">Ingresa tus credenciales para acceder al sistema</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="form-login" novalidate>
            <div class="form-group">
                <label for="email">Correo Electrónico <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="usuario@comedor.edu" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Contraseña <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <div class="btn-group">
                <button type="submit" id="btn-login" class="btn btn-primary">
                    Continuar al Paso 2 &rarr;
                </button>
            </div>
        </form>

        <div class="form-footer">
            <p>¿No tienes una cuenta? <a href="../register/register.html">Regístrate aquí</a></p>
            <p>¿Olvidaste tu contraseña? <a href="../forgot_password/forgot_password.html">Recuperar contraseña</a></p>
        </div>
    </div>
</body>
</html>
