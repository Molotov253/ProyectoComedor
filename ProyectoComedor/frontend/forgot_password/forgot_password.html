<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Sistema Comedor</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="forgot_password.js" defer></script>
</head>
<body>
    <div class="auth-card">
        <div class="card-header">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
            </div>
            <h1 class="card-title">Recuperar Contraseña</h1>
            <p class="card-subtitle">Sigue los 3 pasos para restablecer el acceso a tu cuenta</p>
        </div>

        <div class="stepper">
            <div id="step-ind-1" class="step-indicator active">
                <span class="step-number">1</span> Correo
            </div>
            <div id="step-divider-1" class="step-divider"></div>
            <div id="step-ind-2" class="step-indicator">
                <span class="step-number">2</span> Seguridad
            </div>
            <div id="step-divider-2" class="step-divider"></div>
            <div id="step-ind-3" class="step-indicator">
                <span class="step-number">3</span> Nueva Clave
            </div>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="form-recuperar" novalidate>
            <!-- Paso 1: Identificación por Correo -->
            <div id="contenedor-correo">
                <div class="form-group">
                    <label for="email">Correo Electrónico Registrado <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="usuario@comedor.edu" required autofocus>
                </div>
                <div class="btn-group">
                    <button type="button" id="btn-buscar-correo" class="btn btn-primary">
                        Buscar Cuenta &rarr;
                    </button>
                </div>
            </div>

            <!-- Paso 2: Pregunta de Seguridad -->
            <div id="contenedor-pregunta" style="display: none;">
                <div class="challenge-card">
                    <div class="challenge-card-label">Pregunta de Seguridad</div>
                    <div id="label-pregunta" class="challenge-card-question">Cargando...</div>
                </div>

                <div class="form-group">
                    <label for="respuesta_seguridad">Tu Respuesta <span class="required">*</span></label>
                    <input type="text" id="respuesta_seguridad" name="respuesta_seguridad" placeholder="Escribe tu respuesta" required>
                </div>

                <div class="btn-group">
                    <button type="button" id="btn-volver-correo" class="btn btn-secondary">&larr; Atrás</button>
                    <button type="button" id="btn-validar-respuesta" class="btn btn-primary">Validar Respuesta &rarr;</button>
                </div>
            </div>

            <!-- Paso 3: Cambio de Contraseña -->
            <div id="contenedor-password" style="display: none;">
                <div class="form-group">
                    <label for="new_password">Nueva Contraseña <span class="required">*</span></label>
                    <input type="password" id="new_password" name="new_password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="new_password_confirmation">Confirmar Nueva Contraseña <span class="required">*</span></label>
                    <input type="password" id="new_password_confirmation" name="new_password_confirmation" placeholder="Repite la contraseña" required>
                </div>

                <div class="btn-group">
                    <button type="submit" id="btn-actualizar-pass" class="btn btn-primary">Actualizar Contraseña</button>
                </div>
            </div>
        </form>

        <div class="form-footer">
            <p><a href="../login/login.html">Volver al Inicio de Sesión</a></p>
        </div>
    </div>
</body>
</html>
